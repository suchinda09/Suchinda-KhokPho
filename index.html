<!DOCTYPE html>
<html lang="th" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suchinda Khokpho | Portfolio - คณะพยาบาลศาสตร์ มหาวิทยาลัยมหิดล</title>
    
    <!-- Google Fonts: Prompt -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- AOS (Animate On Scroll) CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Prompt', 'sans-serif'],
                    },
                    colors: {
                        pastel: {
                            pink: '#f472b6',
                            lightPink: '#fce7f3',
                            sky: '#38bdf8',
                            lightSky: '#e0f2fe',
                            yellow: '#facc15',
                            lightYellow: '#fef9c3',
                        }
                    },
                    animation: {
                        'float': 'float 4s ease-in-out infinite',
                        'pulse-slow': 'pulse 6s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-14px)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom Pastel Styles & Glassmorphism */
        body {
            font-family: 'Prompt', sans-serif;
            overflow-x: hidden;
        }
        
        /* Pastel Gradient Text: ชมพูอ่อน - ฟ้าอ่อน */
        .gradient-text {
            background: linear-gradient(135deg, #ec4899 0%, #0ea5e9 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Pastel Gradient Background: ชมพูอ่อน - เหลืองอ่อน - ฟ้าอ่อน */
        .gradient-bg {
            background: linear-gradient(135deg, #f472b6 0%, #38bdf8 100%);
        }

        .pastel-tri-bg {
            background: linear-gradient(120deg, #fdf2f8 0%, #fefce8 50%, #f0f9ff 100%);
        }

        .dark .pastel-tri-bg {
            background: linear-gradient(120deg, #0f172a 0%, #1e1b4b 50%, #0c4a6e 100%);
        }

        .card-hover {
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card-hover:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgba(244, 114, 182, 0.18), 0 8px 10px -6px rgba(56, 189, 248, 0.15);
        }

        .dark .card-hover:hover {
            box-shadow: 0 20px 25px -5px rgba(244, 114, 182, 0.25), 0 8px 10px -6px rgba(56, 189, 248, 0.2);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #fdf2f8;
        }
        .dark ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #f472b6, #fde047, #38bdf8);
            border-radius: 4px;
        }
    </style>

    <!-- Initial Theme Script to prevent FOUC -->
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>

    <div id="scroll-progress" class="fixed top-0 left-0 h-1.5 z-[60] transition-all duration-150" style="width: 0%; background: linear-gradient(90deg, #f472b6 0%, #fde047 50%, #38bdf8 100%);"></div>
